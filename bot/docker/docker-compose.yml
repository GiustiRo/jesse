services:
  jesse:
    image: ${JESSE_IMAGE:-salehmir/jesse:latest}
    depends_on:
      postgres:
        condition: service_healthy
    tty: true
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /src
      JESSE_ENV_FILE: /src/bot/.env
    working_dir: /src/bot
    volumes:
      - ../..:/src
    ports:
      # Host 9100: Portainer already binds 9000 on this Pi.
      - "9100:9000"
    command: bash -c "pip install -q socksio pysocks && jesse run"
    container_name: jesse

  postgres:
    image: timescale/timescaledb:2.19.3-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jesse_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jesse_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    container_name: jesse-postgres
